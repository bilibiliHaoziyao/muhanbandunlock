name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Create signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=MuHan" `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -KeyExportPolicy Exportable `
            -KeyUsage DigitalSignature `
            -FriendlyName "MuHan Band Unlock" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}ca=false&pathlength=1") `
            -NotAfter (Get-Date).AddYears(5)
          $pwd = ConvertTo-SecureString -String "MuHanCI" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\sign.pfx" -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\sign.cer" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\sign.cer" "$env:GITHUB_WORKSPACE\MuHanBandUnlock.cer"

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          foreach ($p in @('x86', 'x64', 'arm64')) {
            msbuild MuHanBandUnlock\MuHanBandUnlock.csproj /t:Restore /p:Configuration=Release /p:Platform=$p /v:minimal
            if ($LASTEXITCODE -ne 0) { throw "Restore failed for platform $p" }
          }

      - name: Build app package (x86 + x64)
        shell: pwsh
        run: |
          msbuild MuHanBandUnlock\MuHanBandUnlock.csproj `
            /t:Publish `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms="x86|x64" `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:RUNNER_TEMP\sign.pfx" `
            /p:PackageCertificatePassword="MuHanCI" `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\appx\" `
            /v:minimal

      - name: Build app package (arm64)
        shell: pwsh
        run: |
          msbuild MuHanBandUnlock\MuHanBandUnlock.csproj `
            /t:Publish `
            /m `
            /p:Configuration=Release `
            /p:Platform=arm64 `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms="arm64" `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:RUNNER_TEMP\sign.pfx" `
            /p:PackageCertificatePassword="MuHanCI" `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\appx_arm64\" `
            /v:minimal

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          foreach ($d in @('appx', 'appx_arm64')) {
            Get-ChildItem -Recurse $d -ErrorAction SilentlyContinue | Select-Object FullName
          }
          $bundles = Get-ChildItem -Path appx,appx_arm64 -Recurse -Include *.appxbundle,*.msixbundle -ErrorAction SilentlyContinue
          if ($null -eq $bundles -or $bundles.Count -eq 0) { throw "No app bundle found" }
          foreach ($b in $bundles) { Copy-Item $b.FullName "release\$($b.Name)" }
          Copy-Item MuHanBandUnlock.cer release\MuHanBandUnlock.cer
          $testDirs = Get-ChildItem -Path appx,appx_arm64 -Recurse -Directory -Filter *_Test -ErrorAction SilentlyContinue
          foreach ($t in $testDirs) {
            $suffix = if ($t.FullName -like '*appx_arm64*') { 'arm64' } else { 'x86-x64' }
            Compress-Archive -Path "$($t.FullName)\*" -DestinationPath "release\MuHanBandUnlock-Sideload-$suffix.zip" -Force
          }
          Get-ChildItem release | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuHanBandUnlock-package
          path: release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 慕寒手环解锁 ${{ github.ref_name }}
          body: |
            ## 慕寒手环解锁 MuHan Band Unlock

            本工具是用于解锁忘记密码的小米手环的。

            ### 安装方法（Windows 10 / 11）

            下载对应架构的安装包：
            - **x86 / x64**（绝大多数电脑）：`MuHanBandUnlock-Sideload-x86-x64.zip`，支持 Windows 10 1507 及以上
            - **arm64**（骁龙等 ARM 设备）：`MuHanBandUnlock-Sideload-arm64.zip`，需 Windows 10 1709 及以上（所有 ARM64 Windows 设备均满足）

            1. 下载 zip 并解压
            2. 先双击 `MuHanBandUnlock.cer` → 安装证书 → 本地计算机 → 受信任的根证书颁发机构
            3. 在解压目录以 PowerShell 运行：
               ```powershell
               Set-ExecutionPolicy -Scope Process Bypass -Force
               .\Add-AppDevPackage.ps1
               ```
            4. 若系统提示开发者模式，请到 设置 → 更新和安全 → 开发人员选项 中开启

            > 也提供 `.appxbundle` / `.msixbundle` 供高级用户手动安装。

            ### 免责声明

            - 本工具仅供个人解锁自己拥有的设备使用，请勿用于他人设备或任何非法用途
            - 本工具为第三方开源工具，与小米公司无任何关联
            - 解锁会重置手环密码，可能清除手环数据，后果自负
          files: |
            release/*
